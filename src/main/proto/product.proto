syntax = "proto3";

package product.v1;

option java_multiple_files = true;
option java_package = "com.example.product.v1";
option java_outer_classname = "ProductProto";

import "google/protobuf/timestamp.proto";

service ProductService {
  rpc CreateProduct (CreateProductRequest) returns (Product);
  rpc GetProduct (GetProductRequest) returns (Product);
  rpc ListProducts (ListProductsRequest) returns (ListProductsResponse);
  rpc UpdateProduct (UpdateProductRequest) returns (Product);
  rpc DeleteProduct (DeleteProductRequest) returns (DeleteProductResponse);
  rpc AdjustStock (AdjustStockRequest) returns (Product);
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string price = 4; // decimal as string, e.g. "19.99"
  int32 stock = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message CreateProductRequest {
  string name = 1;
  string description = 2;
  string price = 3;
  int32 stock = 4;
}

message GetProductRequest {
  string id = 1;
}

message ListProductsRequest {
  int32 page = 1;
  int32 size = 2;
  // Optional: when non-empty, filter products whose name contains this value (case-insensitive).
  string name_contains = 3;
}

message ListProductsResponse {
  repeated Product products = 1;
  int64 total_count = 2;
}

message UpdateProductRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string price = 4;
  int32 stock = 5;
}

message DeleteProductRequest {
  string id = 1;
}

message DeleteProductResponse {
  bool deleted = 1;
}

message AdjustStockRequest {
  string id = 1;
  int32 delta = 2; // positive = restock, negative = sell/consume
}
